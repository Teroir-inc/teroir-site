<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="A drawn sunset: a banded sun over the sea, palm trees, a road running to the horizon and a phone in the foreground.">
<!-- Wyatt Worldwide look v5 hero, drawn in-house (SVG). Comic ink line + three-tone cel shading on solid shapes.
     Palette: art/brand/palette.json. Mood only: no characters, logos or compositions from any reference. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6F5FB8"/><stop offset=".22" stop-color="#8E7CC3"/><stop offset=".42" stop-color="#C9A7EB"/>
    <stop offset=".58" stop-color="#FF9EC7"/><stop offset=".66" stop-color="#FF8A7A"/><stop offset=".7" stop-color="#FFC8A2"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E7CC3"/><stop offset="1" stop-color="#6F5FB8"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B5A9A"/><stop offset="1" stop-color="#3F2F63"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2C66"/><stop offset="1" stop-color="#2A1E55"/></linearGradient>
  <linearGradient id="hz" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
  <clipPath id="sundisc"><circle r="158"/></clipPath>
  <clipPath id="sunclip"><rect x="-200" y="-200" width="400" height="200"/></clipPath>
  <!-- a palm in a 450 x 920 box, base at (216, 900): inked trunk with lit side, ring lines, two-tone fronds, coconuts -->
  <g id="palm">
    <path d="M196 900 C186 760 176 620 188 470 C194 380 206 320 214 300 L236 302 C230 340 220 420 216 500 C210 640 220 780 236 900 Z" fill="#3A2A5C" stroke="#2B1E3F" stroke-width="10" stroke-linejoin="round"/>
    <path d="M200 880 C192 760 186 640 196 500 C200 420 208 360 216 320 L224 322 C218 380 210 460 208 520 C202 650 208 770 216 880 Z" fill="#5B4386"/>
    <g stroke="#2B1E3F" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M190 840 q18 -6 40 0"/><path d="M188 760 q18 -6 40 0"/><path d="M190 680 q16 -6 36 0"/><path d="M194 600 q16 -6 32 0"/><path d="M198 520 q14 -5 28 0"/><path d="M204 440 q12 -5 24 0"/><path d="M208 370 q10 -4 20 0"/>
    </g>
    <g fill="#3A2A5C" stroke="#2B1E3F" stroke-width="10" stroke-linejoin="round">
      <path d="M222 300 C160 250 80 250 10 300 C80 270 150 280 222 312 Z"/>
      <path d="M222 300 C180 210 110 170 40 170 C110 200 170 240 220 314 Z"/>
      <path d="M224 298 C250 200 320 150 400 150 C330 190 280 240 232 312 Z"/>
      <path d="M226 302 C300 250 380 250 440 290 C370 274 300 284 230 316 Z"/>
      <path d="M224 300 C214 220 230 150 270 100 C250 170 246 240 236 310 Z"/>
      <path d="M222 304 C170 330 120 380 96 440 C140 390 190 352 230 318 Z"/>
      <path d="M226 304 C280 330 330 380 350 440 C310 392 266 352 228 320 Z"/>
    </g>
    <g fill="#5B4386">
      <path d="M222 302 C150 240 90 236 40 262 C100 250 160 268 220 306 Z"/>
      <path d="M226 300 C270 210 330 176 380 168 C320 196 274 240 230 306 Z"/>
      <path d="M226 300 C214 230 228 170 258 126 C244 186 240 244 232 304 Z"/>
    </g>
    <circle cx="214" cy="318" r="14" fill="#FF8A7A" stroke="#2B1E3F" stroke-width="6"/>
    <circle cx="236" cy="322" r="12" fill="#FFC8A2" stroke="#2B1E3F" stroke-width="6"/>
    <circle cx="210" cy="313" r="4" fill="#fff" opacity=".8"/>
  </g>
  <!-- a cloud: inked, two-tone -->
  <g id="cloud">
    <path d="M0 40 C0 22 16 12 32 16 C38 0 66 -4 78 12 C92 4 114 10 116 28 C132 28 140 40 136 52 L4 52 C0 50 0 46 0 40 Z" fill="#E9D6FA" stroke="#2B1E3F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M8 46 C30 40 70 44 132 46 L130 50 L6 50 Z" fill="#C9A7EB"/>
  </g>
</defs>

<!-- sky -->
<rect width="800" height="560" fill="url(#sky)"/>
<use xlink:href="#cloud" href="#cloud" transform="translate(70 74) scale(1.1)"/>
<use xlink:href="#cloud" href="#cloud" transform="translate(560 48) scale(.9)"/>
<use xlink:href="#cloud" href="#cloud" transform="translate(470 150) scale(.6)"/>

<!-- the sun: banded, cel-shaded, inked, sitting on the sea -->
<g transform="translate(400 362)"><g clip-path="url(#sunclip)">
  <circle r="158" fill="#FFE2B8"/>
    <g clip-path="url(#sundisc)"><path d="M-158 -60 H158 V0 H-158 Z" fill="#FFC8A2" opacity=".85"/>
  <g fill="#FF8A7A"><rect x="-160" y="-96" width="320" height="10"/><rect x="-160" y="-66" width="320" height="13"/><rect x="-160" y="-36" width="320" height="16"/><rect x="-160" y="-10" width="320" height="10"/></g></g>
  <circle r="158" fill="none" stroke="#2B1E3F" stroke-width="6"/>
  <path d="M-104 -96 a128 128 0 0 1 78 -50" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity=".85"/>
</g></g>

<!-- far hills, cel-shaded -->
<path d="M0 352 C70 300 140 296 214 330 C250 346 282 352 300 362 L0 362 Z" fill="#8E7CC3" stroke="#2B1E3F" stroke-width="5" stroke-linejoin="round"/>
<path d="M0 352 C50 318 100 310 150 322 C100 326 50 340 0 362 Z" fill="#A996D6"/>
<path d="M800 344 C730 304 650 300 584 334 C556 348 530 356 512 362 L800 362 Z" fill="#8E7CC3" stroke="#2B1E3F" stroke-width="5" stroke-linejoin="round"/>
<path d="M800 344 C760 322 716 314 676 320 C720 326 762 340 800 360 Z" fill="#A996D6"/>

<!-- the sea, with peach glints -->
<rect x="0" y="360" width="800" height="54" fill="url(#sea)"/>
<path d="M0 360 H800" stroke="#2B1E3F" stroke-width="5"/>
<g stroke="#FFC8A2" stroke-width="5" stroke-linecap="round"><path d="M330 376 h70 M420 376 h50 M300 392 h40 M450 392 h80 M380 404 h60"/></g>
<g stroke="#FF9EC7" stroke-width="4" stroke-linecap="round" opacity=".8"><path d="M120 384 h40 M640 388 h50 M70 400 h30 M700 402 h40"/></g>

<!-- the land -->
<path d="M0 412 C160 404 300 410 400 410 C520 410 650 402 800 410 L800 560 L0 560 Z" fill="#3A2A5C" stroke="#2B1E3F" stroke-width="5" stroke-linejoin="round"/>
<path d="M0 430 C140 424 260 428 360 428 L120 560 L0 560 Z" fill="#46356E"/>
<path d="M800 430 C660 424 540 428 440 428 L680 560 L800 560 Z" fill="#46356E"/>

<!-- the road, to the horizon -->
<path d="M384 410 L416 410 L700 560 L100 560 Z" fill="url(#road)" stroke="#2B1E3F" stroke-width="6" stroke-linejoin="round"/>
<path d="M392 412 L400 412 L262 560 L176 560 Z" fill="#7A69AC" opacity=".55"/>
<g fill="#FFF3E3" stroke="#2B1E3F" stroke-width="2.5" stroke-linejoin="round">
  <path d="M398 418 L402 418 L403 426 L397 426 Z"/><path d="M396 436 L404 436 L406 450 L394 450 Z"/>
  <path d="M393 466 L407 466 L410 488 L390 488 Z"/><path d="M388 512 L412 512 L417 548 L383 548 Z"/>
</g>
<!-- the Horizon accent, kept: one thin line where the road meets the sea -->
<path d="M300 411 H500" stroke="url(#hz)" stroke-width="3" stroke-linecap="round" opacity=".95"/>

<!-- palms: far small, right medium, left big -->
<use xlink:href="#palm" href="#palm" transform="translate(590 246) scale(.2)"/>
<use xlink:href="#palm" href="#palm" transform="translate(160 202) scale(.15) translate(450 0) scale(-1 1)"/>
<use xlink:href="#palm" href="#palm" transform="translate(624 128) scale(.42)"/>
<use xlink:href="#palm" href="#palm" transform="translate(-74 30) scale(.58)"/>

<!-- the phone: a solid, cel-shaded 3D form standing at the roadside -->
<g transform="translate(652 446) rotate(-9) scale(.8)">
  <ellipse cx="18" cy="170" rx="96" ry="16" fill="#2B1E3F" opacity=".35"/>
  <path d="M64 -118 L84 -104 L84 170 L64 156 Z" fill="#5B4386" stroke="#2B1E3F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-64 156 L64 156 L84 170 L-46 170 Z" fill="#3A2A5C" stroke="#2B1E3F" stroke-width="5" stroke-linejoin="round"/>
  <rect x="-64" y="-118" width="128" height="274" rx="20" fill="#C9A7EB" stroke="#2B1E3F" stroke-width="6"/>
  <rect x="-52" y="-100" width="104" height="226" rx="10" fill="url(#screen)" stroke="#2B1E3F" stroke-width="4"/>
  <rect x="-16" y="-112" width="32" height="6" rx="3" fill="#2B1E3F"/>
  <rect x="-42" y="-86" width="70" height="40" rx="9" fill="#FFF3E3" stroke="#2B1E3F" stroke-width="3"/>
  <path d="M-34 -72 h48 M-34 -58 h34" stroke="#FF8A7A" stroke-width="6" stroke-linecap="round"/>
  <rect x="-20" y="-36" width="62" height="30" rx="9" fill="#FF9EC7" stroke="#2B1E3F" stroke-width="3"/>
  <rect x="-42" y="4" width="54" height="30" rx="9" fill="#FFC8A2" stroke="#2B1E3F" stroke-width="3"/>
  <rect x="-42" y="94" width="84" height="18" rx="9" fill="#FF9EC7" stroke="#2B1E3F" stroke-width="3"/>
  <path d="M-58 -104 L-14 -104 L-58 -20 Z" fill="#fff" opacity=".3"/>
  <g stroke="#2B1E3F" stroke-width="2.5" opacity=".55"><path d="M70 -80 l10 8 M70 -40 l10 8 M70 0 l10 8 M70 40 l10 8 M70 80 l10 8 M70 120 l10 8"/></g>
  <circle cx="0" cy="142" r="6" fill="none" stroke="#2B1E3F" stroke-width="3"/>
</g>
</svg>
